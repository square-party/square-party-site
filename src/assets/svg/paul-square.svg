<?xml version="1.0" encoding="UTF-8"?>
<svg id="paulsquare" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Paul's square — Peace, Power, Planet, People around a celestial body">
  <defs>
    <linearGradient id="psq1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#100820"/><stop offset="100%" stop-color="#321e5c"/></linearGradient>
    <linearGradient id="psq2" x1="1" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1a0408"/><stop offset="100%" stop-color="#3d1020"/></linearGradient>
    <linearGradient id="psq3" x1="0" y1="1" x2="1" y2="0"><stop offset="0%" stop-color="#041612"/><stop offset="100%" stop-color="#0a3626"/></linearGradient>
    <linearGradient id="psq4" x1="1" y1="1" x2="0" y2="0"><stop offset="0%" stop-color="#040e1a"/><stop offset="100%" stop-color="#0a2a52"/></linearGradient>
    <radialGradient id="psqBigGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c8e8f5" stop-opacity="0.35"/>
      <stop offset="20%" stop-color="#a8d8f0" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#6ab4d8" stop-opacity="0.10"/>
      <stop offset="70%" stop-color="#4a90b8" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#5dade2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="psqHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#05101a" stop-opacity="0.72"/>
      <stop offset="58%" stop-color="#05101a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#05101a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="psqFace" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f2f9ff"/>
      <stop offset="30%" stop-color="#daeef8"/>
      <stop offset="65%" stop-color="#b8d8ee"/>
      <stop offset="100%" stop-color="#8ab8d4"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="160" height="160" fill="url(#psq1)"/>
  <rect x="160" y="0" width="160" height="160" fill="url(#psq2)"/>
  <rect x="0" y="160" width="160" height="160" fill="url(#psq3)"/>
  <rect x="160" y="160" width="160" height="160" fill="url(#psq4)"/>

  <circle cx="160" cy="160" r="155" fill="url(#psqBigGlow)"/>

  <circle cx="38" cy="28" r="1.1" fill="white" opacity="0.55"/>
  <circle cx="120" cy="22" r="1.3" fill="white" opacity="0.6"/>
  <circle cx="200" cy="34" r="1.2" fill="white" opacity="0.58"/>
  <circle cx="285" cy="66" r="1" fill="white" opacity="0.5"/>
  <circle cx="55" cy="88" r="0.7" fill="white" opacity="0.35"/>
  <circle cx="22" cy="118" r="0.9" fill="white" opacity="0.38"/>
  <circle cx="248" cy="18" r="0.8" fill="white" opacity="0.42"/>
  <circle cx="302" cy="44" r="1.1" fill="white" opacity="0.48"/>
  <circle cx="42" cy="62" r="0.9" fill="white" opacity="0.42"/>
  <circle cx="265" cy="130" r="0.9" fill="white" opacity="0.3"/>

  <line x1="160" y1="0" x2="160" y2="320" stroke="#c8e8f5" stroke-width="0.5" opacity="0.12"/>
  <line x1="0" y1="160" x2="320" y2="160" stroke="#c8e8f5" stroke-width="0.5" opacity="0.12"/>

  <circle cx="160" cy="160" r="42" fill="url(#psqHalo)"/>
  <circle cx="160" cy="160" r="22" fill="url(#psqFace)"/>
  <circle cx="155" cy="155" r="3.5" fill="#a8ccde" opacity="0.28"/>
  <circle cx="166" cy="164" r="2.2" fill="#a8ccde" opacity="0.2"/>

  <text x="80" y="84" text-anchor="middle" fill="#b8a8e0" font-size="11" font-family="'DM Sans', system-ui, sans-serif" font-weight="500" letter-spacing="0.14em" opacity="0.9">PEACE</text>
  <text x="240" y="84" text-anchor="middle" fill="#e8969e" font-size="11" font-family="'DM Sans', system-ui, sans-serif" font-weight="500" letter-spacing="0.14em" opacity="0.9">POWER</text>
  <text x="80" y="246" text-anchor="middle" fill="#82e0aa" font-size="11" font-family="'DM Sans', system-ui, sans-serif" font-weight="500" letter-spacing="0.14em" opacity="0.9">PLANET</text>
  <text x="240" y="246" text-anchor="middle" fill="#76d7c4" font-size="11" font-family="'DM Sans', system-ui, sans-serif" font-weight="500" letter-spacing="0.14em" opacity="0.9">PEOPLE</text>

  <rect x="0" y="0" width="320" height="320" fill="none" stroke="#7ec8e3" stroke-width="3.5" opacity="0.55"/>
</svg>
