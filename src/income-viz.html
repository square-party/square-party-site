<!-- Plain-JS helpers + data loader. data.json is produced by
     income-viz-src/analysis.py from raw Census + SCF + PSZ sources. -->
<script>
window.interpAtPercentile = function (curve, p, key = 'income') {
  if (p <= curve[0].p) return curve[0][key];
  if (p >= curve[curve.length - 1].p) return curve[curve.length - 1][key];
  for (let i = 0; i < curve.length - 1; i++) {
    const a = curve[i], b = curve[i + 1];
    if (p >= a.p && p <= b.p) {
      const t = (p - a.p) / (b.p - a.p);
      // log interp when both positive (smooth tail)
      if (a[key] > 0 && b[key] > 0) {
        const la = Math.log(a[key]), lb = Math.log(b[key]);
        return Math.exp(la + t * (lb - la));
      }
      return a[key] + t * (b[key] - a[key]);
    }
  }
  return curve[curve.length - 1][key];
};

// Inverse: given an income, find percentile (uses log interp in tail)
window.percentileForIncome = function (curve, val, key = 'income') {
  if (val <= curve[0][key]) return curve[0].p;
  if (val >= curve[curve.length - 1][key]) return curve[curve.length - 1].p;
  for (let i = 0; i < curve.length - 1; i++) {
    const a = curve[i], b = curve[i + 1];
    if (val >= a[key] && val <= b[key]) {
      if (a[key] > 0 && b[key] > 0) {
        const lv = Math.log(val), la = Math.log(a[key]), lb = Math.log(b[key]);
        return a.p + (lv - la) / (lb - la) * (b.p - a.p);
      }
      return a.p + (val - a[key]) / (b[key] - a[key]) * (b.p - a.p);
    }
  }
  return 99.99;
};

// Number formatters
window.fmt = {
  money: (n) => {
    if (n < 0) return '-' + window.fmt.money(-n);
    if (n >= 1e9) return '$' + (n / 1e9).toFixed(n >= 1e10 ? 0 : 1) + 'B';
    if (n >= 1e6) return '$' + (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + 'M';
    if (n >= 1e3) return '$' + Math.round(n / 1e3) + 'K';
    return '$' + Math.round(n);
  },
  moneyFull: (n) => '$' + Math.round(n).toLocaleString('en-US'),
  pct: (n, dp = 0) => n.toFixed(dp) + '%',
};

// Load the data file (produced by analysis.py) before React renders.
window.__dataReady = fetch('./income-viz-src/data.json')
  .then(r => r.json())
  .then(data => { window.DATA = data; });
</script>

<!-- Fig 1: Concept 1 — Distribution -->
<script type="text/babel" data-presets="react">
// Concept 1: The Missing Middle Class
// Shows the imagined bell curve overlaid on the actual long-tail PDF.
// In linear mode we focus the visible range on the bulk of households
// (P0–P95) and let a clearly-marked "broken axis" carry the top tail.
// In log mode we show the full range and the bell visibly compressed.
// Your-income marker.

const C1_W = 980;
const C1_H = 550;

function buildSamplesLin(curve, key, maxVal) {
  const out = [];
  for (let p = 0.5; p < 99.99; p += 0.25) {
    const v = window.interpAtPercentile(curve, p, key);
    if (v >= 0 && v <= maxVal) out.push(v);
  }
  return out;
}
function buildSamplesLog(curve, key) {
  const out = [];
  for (let p = 0.5; p < 99.99; p += 0.25) {
    const v = window.interpAtPercentile(curve, p, key);
    if (v > 0) out.push(v);
  }
  for (let p = 99; p < 99.99; p += 0.05) {
    const v = window.interpAtPercentile(curve, p, key);
    if (v > 0) out.push(v);
  }
  return out;
}
function bucketize(samples, vMin, vMax, n, scale) {
  const buckets = [];
  for (let i = 0; i < n; i++) {
    const lo = scale === 'log'
      ? Math.pow(10, Math.log10(vMin) + (i / n) * (Math.log10(vMax) - Math.log10(vMin)))
      : vMin + (i / n) * (vMax - vMin);
    const hi = scale === 'log'
      ? Math.pow(10, Math.log10(vMin) + ((i + 1) / n) * (Math.log10(vMax) - Math.log10(vMin)))
      : vMin + ((i + 1) / n) * (vMax - vMin);
    buckets.push({ lo, hi, count: 0 });
  }
  for (const s of samples) {
    const t = scale === 'log'
      ? (Math.log10(s) - Math.log10(vMin)) / (Math.log10(vMax) - Math.log10(vMin))
      : (s - vMin) / (vMax - vMin);
    const idx = Math.min(n - 1, Math.max(0, Math.floor(t * n)));
    buckets[idx].count++;
  }
  return buckets;
}

function ConceptDistribution({ tweaks }) {
  const { metric, scale, yourIncome } = tweaks;
  const curve = metric === 'wealth' ? window.DATA.wealthByPercentile2024 : window.DATA.incomeByPercentile2024;
  const key = metric === 'wealth' ? 'wealth' : 'income';

  // Linear mode: cap the x-axis at P95 so the bulk is visible. A right-side
  // "break" panel carries P95+ as a separate clamp.
  // Log mode: full range.
  const median = window.interpAtPercentile(curve, 50, key);
  const p95 = window.interpAtPercentile(curve, 95, key);
  const maxObserved = curve[curve.length - 1][key];

  const padL = 60, padR = 40, padT = 70, padB = 76;

  let mainPlotW, breakPlotW, breakStart, breakEnd;
  const innerH = C1_H - padT - padB;

  if (scale === 'linear') {
    breakPlotW = 180;
    mainPlotW = (C1_W - padL - padR) - breakPlotW - 36; // 36px gap for break marker
    breakStart = p95;
    breakEnd = maxObserved;
  } else {
    mainPlotW = C1_W - padL - padR;
    breakPlotW = 0;
  }

  const mainMin = scale === 'log' ? Math.max(1, curve[0][key] > 0 ? curve[0][key] : 1000) : 0;
  const mainMax = scale === 'log' ? maxObserved : p95 * 1.05;

  const mainSamples = scale === 'log'
    ? buildSamplesLog(curve, key)
    : buildSamplesLin(curve, key, mainMax);
  const mainBuckets = bucketize(mainSamples, scale === 'log' ? mainMin : 1, mainMax, scale === 'log' ? 70 : 60, scale);

  // For linear: also build a tail sample for the break panel
  const tailBuckets = scale === 'linear'
    ? bucketize(
        buildSamplesLin(curve, key, maxObserved).filter((v) => v >= breakStart),
        breakStart, breakEnd, 24, 'linear'
      )
    : [];

  const maxCountAll = Math.max(
    ...mainBuckets.map((b) => b.count),
    ...tailBuckets.map((b) => b.count)
  );

  const xMain = (v) => {
    if (scale === 'log') {
      return ((Math.log10(Math.max(mainMin, v)) - Math.log10(mainMin)) /
              (Math.log10(mainMax) - Math.log10(mainMin))) * mainPlotW;
    }
    return ((v - mainMin) / (mainMax - mainMin)) * mainPlotW;
  };
  const xBreak = (v) => mainPlotW + 36 + ((v - breakStart) / (breakEnd - breakStart)) * breakPlotW;
  const yScale = (c) => innerH - (c / maxCountAll) * innerH;

  // Imagined bell curve, centered around the median, std ~ 35% of median
  const std = median * 0.35;
  const bellAt = (x) => {
    const z = (x - median) / std;
    return Math.exp(-0.5 * z * z);
  };

  // Bell path (in main plot only — bell vanishes in tail)
  const bellSamples = 200;
  const bellPath = (() => {
    const pts = [];
    for (let i = 0; i <= bellSamples; i++) {
      const x = scale === 'log'
        ? Math.pow(10, Math.log10(mainMin) + (i / bellSamples) * (Math.log10(mainMax) - Math.log10(mainMin)))
        : mainMin + (i / bellSamples) * (mainMax - mainMin);
      const y = bellAt(x);
      pts.push([xMain(x), innerH - y * innerH * 0.85]);
    }
    return pts.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p[0]} ${p[1]}`).join(' ');
  })();
  const bellFill = `M ${xMain(mainMin)} ${innerH} ${bellPath} L ${xMain(mainMax)} ${innerH} Z`;

  // Tick marks
  const mainTicks = scale === 'log'
    ? [10000, 100000, 1000000, 10000000, 100000000].filter((t) => t >= mainMin && t <= mainMax)
    : [0, 100000, 200000, 300000].filter((t) => t <= mainMax);
  const breakTicks = scale === 'linear'
    ? [1000000, 10000000, 30000000].filter((t) => t >= breakStart && t <= breakEnd)
    : [];

  // Percentile markers
  const pcts = scale === 'log' ? [50, 90, 99, 99.9, 99.99] : [50, 90, 95, 99, 99.9, 99.99];

  const xForVal = (v) => {
    if (scale === 'log') return xMain(v);
    if (v <= mainMax) return xMain(v);
    return xBreak(Math.min(v, breakEnd));
  };

  // Your-income marker
  const yourX = xForVal(yourIncome);
  const yourPct = window.percentileForIncome(curve, yourIncome, key);
  const yourInBreak = scale === 'linear' && yourIncome > mainMax;

  return (
    <div className="c1-wrap">
      <div className="c1-header">
        <div className="c1-eyebrow">CONCEPT 01 — THE MISSING MIDDLE CLASS</div>
        <h2 className="c1-title">
          {scale === 'linear'
            ? <>Income inequality <em>literally</em> breaks the x-axis.</>
            : <>People <em>stretch</em> the x-axis with log-scale to show the data.</>}
        </h2>
        <p className="c1-sub">
          The faint dashed curve is what people <em>imagine</em> US {metric === 'wealth' ? 'wealth' : 'income'} should look like — a bell around the middle class.
          The dark mass is what it actually is.
        </p>
      </div>

      <svg viewBox={`0 0 ${C1_W} ${C1_H}`} className="c1-svg">
        <g transform={`translate(${padL}, ${padT})`}>
          {/* main plot grid */}
          {mainTicks.map((t) => (
            <g key={t}>
              <line x1={xMain(t)} x2={xMain(t)} y1={0} y2={innerH}
                stroke="rgba(40,30,20,.06)" strokeDasharray="2 4" />
              <text x={xMain(t)} y={innerH + 20} textAnchor="middle"
                className="c1-tick" style={{ fontSize: '13px' }}>{window.fmt.money(t)}</text>
            </g>
          ))}

          {/* imagined bell */}
          <path d={bellFill} fill="rgba(201,100,66,.08)" />
          <path d={bellPath} fill="none" stroke="rgba(201,100,66,.55)"
            strokeWidth="1.5" strokeDasharray="4 3" />
          {(() => {
            const bellLblX = xMain(median) + 38;
            const bellLblY = innerH - innerH * 0.78;
            return (
              <text x={bellLblX} y={bellLblY} textAnchor="start" className="c1-bell-label" style={{ fontSize: '11px', fill: 'rgba(201,100,66,.85)', fontStyle: 'italic' }}>
                <tspan x={bellLblX}>← what</tspan>
                <tspan x={bellLblX} dy="1.25em">people</tspan>
                <tspan x={bellLblX} dy="1.25em">imagine</tspan>
              </text>
            );
          })()}

          {/* actual bars — main */}
          {mainBuckets.map((b, i) => {
            const x = xMain(b.lo);
            const w = Math.max(1, xMain(b.hi) - xMain(b.lo) - 0.5);
            const h = (b.count / maxCountAll) * innerH;
            return (
              <rect key={i} x={x} y={innerH - h} width={w} height={h}
                fill="#1f1d18" opacity="0.9" />
            );
          })}

          {/* break marker between main and tail (linear only) */}
          {scale === 'linear' && (
            <g>
              <line x1={mainPlotW + 6} x2={mainPlotW + 6} y1={-8} y2={innerH}
                stroke="rgba(40,30,20,.25)" strokeDasharray="3 3" />
              <text x={mainPlotW + 18} y={28} textAnchor="middle" className="c1-break-lbl" style={{ fontSize: '11px', fill: 'rgba(40,30,20,.55)', letterSpacing: '0.06em', textTransform: 'uppercase' }}>
                <tspan x={mainPlotW + 18}>axis</tspan>
                <tspan x={mainPlotW + 18} dy="1.15em">break</tspan>
              </text>
              <path d={`M ${mainPlotW + 12} ${innerH - 4} l 6 -8 M ${mainPlotW + 18} ${innerH - 4} l 6 -8`}
                stroke="rgba(40,30,20,.4)" strokeWidth="1" fill="none" />

              {/* tail bars */}
              {tailBuckets.map((b, i) => {
                const x = xBreak(b.lo);
                const w = Math.max(1, xBreak(b.hi) - xBreak(b.lo) - 0.5);
                const h = (b.count / maxCountAll) * innerH;
                return (
                  <rect key={i} x={x} y={innerH - h} width={w} height={h}

                );

              {breakTicks.map((t) => (
                <g key={t}>
                  <line x1={xBreak(t)} x2={xBreak(t)} y1={0} y2={innerH}
                    stroke="rgba(40,30,20,.06)" strokeDasharray="2 4" />
                  <text x={xBreak(t)} y={innerH + 20} textAnchor="middle"
                    className="c1-tick" style={{ fontSize: '13px' }}>{window.fmt.money(t)}</text>
                </g>

              <text x={mainPlotW + 36 + breakPlotW / 2} y={innerH + 44}

                the long tail · 95% → 99.99%
              </text>
            </g>
          )}

          {/* percentile markers */}
          {pcts.map((p) => {
            const v = window.interpAtPercentile(curve, p, key);
            const x = xForVal(v);
            const inBreak = scale === 'linear' && v > mainMax;
            if (x < 0) return null;
            // Avoid label collision: P99.9 in linear-mode break panel shifts right of its line
            const shiftRight = scale === 'linear' && p === 99.9;
            const labelX = shiftRight ? x + 6 : x;
            const labelAnchor = shiftRight ? 'start' : 'middle';
            return (
              <g key={p}>
                <line x1={x} x2={x} y1={-12} y2={innerH}
                  stroke="rgba(40,30,20,.3)" strokeWidth="0.7" />
                <text x={labelX} y={-22} textAnchor={labelAnchor} className="c1-pct" style={{ fontSize: '12px' }}>

                </text>
                <text x={labelX} y={-36} textAnchor={labelAnchor} className="c1-pct-val" style={{ fontSize: '13px', fontWeight: 600 }}>
                  {window.fmt.money(v)}

          {/* x-axis */}
          <line x1={0} x2={mainPlotW} y1={innerH} y2={innerH} stroke="rgba(40,30,20,.4)" />
          {/* x-axis title */}
          <text x={mainPlotW / 2} y={innerH + 48} textAnchor="middle" style={{ fontSize: '11px', letterSpacing: '0.05em', textTransform: 'uppercase', fill: 'rgba(40,30,20,.5)' }}>
            Annual {metric === 'wealth' ? 'net worth' : 'income'}, USD
          </text>
          {scale === 'linear' && (
            <line x1={mainPlotW + 36} x2={mainPlotW + 36 + breakPlotW} y1={innerH} y2={innerH} stroke="rgba(40,30,20,.4)" />
          )}

          {/* your-income marker */}
          {yourX >= 0 && (
            <g>
              <line x1={yourX} x2={yourX} y1={-4} y2={innerH}
                stroke="#c96442" strokeWidth="2" />
              <circle cx={yourX} cy={-4} r="5" fill="#c96442" />
              <text x={yourX} y={innerH + 70} textAnchor="middle" className="c1-you">
                you · {window.fmt.money(yourIncome)} · {yourPct.toFixed(yourPct > 99 ? 2 : 1)}%
              </text>

      </svg>

      <div className="c1-footnote">
        {scale === 'linear' ? (
          <>
            <strong>What you're seeing:</strong> the actual distribution is a tall spike on the left followed by an invisibly long tail.
            We had to <em>break the x-axis</em> just to fit the top 5% on the page — and even then, the top 0.01% is a sliver pinned against the right edge.
            The "bell" the imagined curve suggests doesn't exist. There is no symmetric middle. Toggle to log to see the tail at full extent.
          </>
        ) : (
          <>
            <strong>What you're seeing:</strong> on a log axis, each gridline is 10× the last. The distribution finally <em>looks</em> like something you can read —
            but only because every step rightward is an order of magnitude. The bell curve is now visibly tiny, compressed into the lower-middle of the chart.
            Toggle back to linear to feel the spike.
          </>
        )}
      </div>
    </div>
  );
}

<!-- Fig 2: Concept 2 — Rate of departure -->
<script type="text/babel" data-presets="react">
// Concept 2: The Rate of Departure
// Real income growth indexed to 1980. Each line is a percentile band.
// The story isn't "the rich got richer" — it's that the slopes diverged.
// Year scrubber + log/linear toggle.

const C2_W = 980;
const C2_H = 508;

function ConceptRate({ tweaks }) {
  const { scale, year } = tweaks;

  // Mobile detection. The in-chart callout (foreignObject) doesn't degrade
  // gracefully when the SVG shrinks to a phone-width viewport — text inside
  // overflows the box. On narrow screens, render the same callout below the
  // chart instead, as a normal HTML element with room to breathe.
  const [calloutInChart, setCalloutInChart] = React.useState(true);
  React.useEffect(() => {
    const update = () => setCalloutInChart(window.innerWidth >= 720);
    update();
    window.addEventListener('resize', update);
    return () => window.removeEventListener('resize', update);
  }, []);

  const series = window.DATA.growthSeries;
  const years = series.years;
  const groups = series.groups;

  const padL = 70, padR = 50, padT = 50, padB = 98;
  const innerW = C2_W - padL - padR;
  const innerH = C2_H - padT - padB;

  // Best-fit y-axis: compute from data with 10% headroom, snap to clean number
  const yMaxRaw = Math.max(...Object.values(groups).flatMap(arr => arr));
  const yMax = Math.max(200, Math.ceil(yMaxRaw * 1.10 / 100) * 100);
  const yMin = scale === 'log' ? 90 : 80;

  const xScale = (y) => ((y - years[0]) / (years[years.length - 1] - years[0])) * innerW;
  const yScale = (v) => {
    if (scale === 'log') {
      const lMin = Math.log10(yMin), lMax = Math.log10(yMax);
      return innerH - ((Math.log10(v) - lMin) / (lMax - lMin)) * innerH;
    }
    return innerH - ((v - yMin) / (yMax - yMin)) * innerH;
  };

  const colors = {
    'Bottom 50%':  '#7d8b6f',
    'Middle 40%':  '#5d7290',
    'Top 10%':     '#c69770',
    'Top 1%':      '#c96442',
    'Top 0.1%':    '#9c3a2a',
    'Top 0.01%':   '#5e1a14',
  };

  // Truncate series at currently scrubbed year
  const yIdx = years.findIndex((y) => y >= year);
  const cutIdx = yIdx === -1 ? years.length - 1 : yIdx;

  // For interpolation at exact year
  const interpAt = (vals, y) => {
    if (y <= years[0]) return vals[0];
    if (y >= years[years.length - 1]) return vals[vals.length - 1];
    for (let i = 0; i < years.length - 1; i++) {
      if (y >= years[i] && y <= years[i + 1]) {
        const t = (y - years[i]) / (years[i + 1] - years[i]);
        return vals[i] + t * (vals[i + 1] - vals[i]);
      }
    }
    return vals[vals.length - 1];
  };

  // Generate adaptive y-ticks based on yMax
  const yTicks = (() => {
    if (scale === 'log') {
      const candidates = [100, 200, 500, 1000, 2000, 5000];
      const inRange = candidates.filter(t => t >= yMin && t <= yMax);
      if (inRange[inRange.length - 1] !== yMax) inRange.push(yMax);
      return inRange;
    }
    // linear: pick a step that gives ~4-5 ticks
    const targetTicks = 4;
    const rawStep = yMax / targetTicks;
    const magnitude = Math.pow(10, Math.floor(Math.log10(rawStep)));
    const niceSteps = [1, 2, 2.5, 5, 10].map(s => s * magnitude);
    const step = niceSteps.find(s => yMax / s <= targetTicks + 1) || niceSteps[niceSteps.length - 1];
    const ticks = [100];
    for (let t = step; t <= yMax; t += step) {
      if (t > 100) ticks.push(Math.round(t));
    }
    return ticks;
  })();

  const xTicks = [1980, 1990, 2000, 2010, 2020];

  // Compute "exit velocity": each group's value at scrub year
  const groupOrder = Object.keys(groups);
  const currentValues = groupOrder.map((g) => ({
    name: g,
    val: interpAt(groups[g], year),
    color: colors[g],
  })).sort((a, b) => a.val - b.val);

  // Shared callout content — identical wording whether placed in-chart (desktop)
  // or below-chart (mobile). Defined here so the desktop foreignObject and the
  // mobile div both render the same JSX.
  const calloutInner = (
    <React.Fragment>
      <div className="c2-callout-title">Not ‘normal income inequality’</div>
      <div className="c2-callout-body">
        From 1980 to <strong>{year}</strong>, the bottom half of households gained{' '}
        <strong>{Math.round(interpAt(groups['Bottom 50%'], year) - 100)}%</strong>{' '}
        in real income. The top 0.01% gained{' '}
        <strong>{Math.round(interpAt(groups['Top 0.01%'], year) - 100)}%</strong> —{' '}
        a factor of <strong>{((interpAt(groups['Top 0.01%'], year) - 100) / Math.max(1, interpAt(groups['Bottom 50%'], year) - 100)).toFixed(0)}×</strong>.
      </div>
      <div className="c2-callout-verdict">
        Not just the rich getting richer — a different game entirely.
      </div>
    </React.Fragment>
  );

  return (
    <div className="c2-wrap">
      <div className="c2-header">
        <div className="c2-eyebrow">CONCEPT 02 — THE RATE OF DEPARTURE</div>
        <h2 className="c2-title">
          The slopes diverge. <em>That</em> is the story.
        </h2>
        <p className="c2-sub">
          Each line is a band of US households, indexed to <strong>100 in 1980</strong>.
          A line at 200 means real income doubled. The Top 0.01% reads <strong>{Math.round(interpAt(groups['Top 0.01%'], year))}</strong> in {year}—
          they've left the chart.
        </p>
      </div>

      <svg viewBox={`0 0 ${C2_W} ${C2_H}`} className="c2-svg">
        <defs>
          <linearGradient id="c2fade" x1="0" x2="1">
            <stop offset="0" stopColor="#1f1d18" stopOpacity="0" />
            <stop offset="1" stopColor="#1f1d18" stopOpacity="1" />
          </linearGradient>
        </defs>
        <g transform={`translate(${padL}, ${padT})`}>
          {/* y-grid */}
          {yTicks.map((t) => (
            <g key={t}>
              <line x1={0} x2={innerW} y1={yScale(t)} y2={yScale(t)}
                stroke={t === 100 ? 'rgba(40,30,20,.25)' : 'rgba(40,30,20,.06)'}
                strokeWidth={t === 100 ? 1 : 0.5} />
              <text x={-10} y={yScale(t) + 4} textAnchor="end" className="c2-tick">
                {t}
              </text>
            </g>
          ))}

          {/* x-grid */}
          {xTicks.map((t) => (
            <g key={t}>
              <line x1={xScale(t)} x2={xScale(t)} y1={0} y2={innerH}
                stroke="rgba(40,30,20,.06)" strokeWidth="0.5" />
              <text x={xScale(t)} y={innerH + 22} textAnchor="middle" className="c2-tick">
                {t}
              </text>
            </g>
          ))}

          {/* lines */}
          {groupOrder.map((g) => {
            const vals = groups[g];
            // build path through visible portion
            const pts = [];
            for (let i = 0; i <= cutIdx; i++) {
              if (years[i] <= year) {
                pts.push([xScale(years[i]), yScale(vals[i])]);
              }
            }
            // interpolated point at exact year
            if (year < years[years.length - 1] && year > years[0]) {
              const v = interpAt(vals, year);
              pts.push([xScale(year), yScale(v)]);
            }
            const path = pts.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p[0]} ${p[1]}`).join(' ');
            const last = pts[pts.length - 1];
            return (
              <g key={g}>
                <path d={path} fill="none" stroke={colors[g]}
                  strokeWidth={g === 'Top 0.01%' || g === 'Top 0.1%' ? 2.5 : 2}
                  strokeLinejoin="round" strokeLinecap="round" />
                {/* end dot */}
                {last && (
                  <circle cx={last[0]} cy={last[1]} r={4}
                    fill={colors[g]} stroke="#faf7f2" strokeWidth="1.5" />
                )}
              </g>
            );
          })}

          {/* year cursor — line + large dynamic year label, transparent background */}
          <line x1={xScale(year)} x2={xScale(year)} y1={-10} y2={innerH}
            stroke="rgba(40,30,20,.35)" strokeWidth="1.5" strokeDasharray="3 3" />
          <text x={xScale(year)} y={-10} textAnchor="middle"
            style={{
              fontFamily: '"Source Serif 4", ui-serif, serif',
              fontSize: '30px',
              fontWeight: 800,
              fill: '#c96442',
              letterSpacing: '-0.02em',
              fontVariantNumeric: 'tabular-nums',
            }}>
            {year}
          </text>

          {/* In-chart callout in the empty upper-left corner. Desktop only —
              on mobile the same callout renders below the chart (see below the
              </svg>). */}
          {calloutInChart && (
            <foreignObject x={10} y={10} width={340} height={168}>
              <div xmlns="http://www.w3.org/1999/xhtml" className="c2-callout">
                {calloutInner}
              </div>
            </foreignObject>
          )}
        </g>

        {/* bottom legend — centered, horizontal */}
        {(() => {
          const itemW = 145;
          const groupCount = currentValues.length;
          const totalW = groupCount * itemW;
          const startX = (C2_W - totalW) / 2;
          const yBase = C2_H - 58;
          return (
            <g transform={`translate(${startX}, ${yBase})`}>
              <text x={totalW / 2} y={0} textAnchor="middle" className="c2-legend-title">
                in {year}
              </text>
              {currentValues.map((g, i) => (
                <g key={g.name} transform={`translate(${i * itemW + 10}, 12)`}>
                  <rect x={0} y={0} width={3} height={32} fill={g.color} />
                  {/* static row: group name — bold sans serif */}
                  <text x={10} y={13} className="c2-legend-name"
                    style={{ fontWeight: 700, fontSize: '12px', letterSpacing: '0.02em' }}>
                    {g.name}
                  </text>
                  {/* dynamic row: index + delta — matches year cursor's serif treatment */}
                  <text x={10} y={30} className="c2-legend-val"
                    style={{
                      fontFamily: '"Source Serif 4", ui-serif, serif',
                      fontWeight: 700,
                      fontVariantNumeric: 'tabular-nums',
                    }}>
                    {Math.round(g.val)}
                    <tspan className="c2-legend-delta" dx="5"
                      style={{ fontWeight: 500, fill: 'rgba(40,30,20,.6)' }}>
                      {g.val >= 100 ? `+${Math.round(g.val - 100)}%` : `${Math.round(g.val - 100)}%`}
                    </tspan>
                  </text>
                </g>
              ))}
            </g>
          );
        })()}
      </svg>

      {/* Mobile placement of the callout (matches the in-chart version when on
          desktop ≥720px wide). foreignObject doesn't degrade well at phone
          widths so the same content sits below the chart here. */}
      {!calloutInChart && (
        <div className="c2-callout c2-callout-mobile">
          {calloutInner}
        </div>
      )}
    </div>
  );
}

window.ConceptRate = ConceptRate;
</script>

<!-- Fig 3: Concept 3 — Physical metaphor (football field) -->
<script type="text/babel" data-presets="react">
// Concept 3: The Physical Metaphor
// Two metaphors: (a) football field — distance the median household
// would have to walk to reach the wealth of various groups; (b) house —
// median household = a normal house, top groups = building scaled up
// in 3D until the building IS the city.

const C3_W = 980;
const C3_H = 580;

function ConceptMetaphor({ tweaks }) {
  const { metric } = tweaks;
  const data = window.DATA;
  const wealthOrIncome = (k) =>
    metric === 'wealth' ? data.headline[k + 'Wealth'] : data.headline[k];

  // Anchor: median = 1 unit
  const anchor = metric === 'wealth' ? data.headline.medianWealth : data.headline.median;
  const ratios = [
    { label: '50% · Median household', short: 'Median', val: anchor, ratio: 1 },
    { label: '99% · Top 1%', short: 'Top 1%', val: wealthOrIncome('top1'), ratio: wealthOrIncome('top1') / anchor },
    { label: '99.9% · Top 0.1%', short: 'Top 0.1%', val: wealthOrIncome('top01'), ratio: wealthOrIncome('top01') / anchor },
    { label: '99.99% · Top 0.01%', short: 'Top 0.01%', val: wealthOrIncome('top001'), ratio: wealthOrIncome('top001') / anchor },
  ];

  return <FieldMetaphor ratios={ratios} metric={metric} />;
}

// ─── Football field metaphor ─────────────────────────────────
// Median household = 1 yard. Each step you walk = $X. How far do you
// have to walk to "reach" the top 1%? Top 0.1%? Top 0.01%?
function FieldMetaphor({ ratios, metric }) {
  // 1 yard per median-multiple. Render each as a single horizontal bar
  // running across the panel. Bar lengths are proportional within a
  // shared scale so the eye reads the ratios directly.
  const totalSteps = ratios[ratios.length - 1].ratio; // top 0.01%
  // Use a SQRT compression so smaller bars stay visible while the largest
  // doesn't blow out — and label what the compression is doing.
  const compressed = (n) => Math.sqrt(n);
  const maxC = compressed(totalSteps);
  const trackW = 460;
  const yardsPerField = 100;

  return (
    <div className="c3-wrap">
      <div className="c3-header">
        <div className="c3-eyebrow">CONCEPT 03 — IN FOOTBALL FIELDS</div>
        <h2 className="c3-title">
          One human step - one yard - gets you to the median. <em>{Math.round(totalSteps).toLocaleString()}</em> steps to the top.
        </h2>
        <p className="c3-sub">
          One step is the distance from <strong>$0 to the median {metric === 'wealth' ? 'household net worth' : 'household income'}</strong>.
          How many such steps would you walk to reach each higher group?
          The bars below are √-compressed so the median stays visible.
        </p>
      </div>

      <div className="c3-body">
      <div className="c3-field-stack">
        {ratios.map((r) => {
          const cw = (compressed(r.ratio) / maxC) * trackW;
          const fullFields = Math.floor(r.ratio / yardsPerField);
          return (
            <div key={r.label} className="c3-field-row">
              <div className="c3-field-label">
                <div className="c3-field-name">{r.label}</div>
                <div className="c3-field-val">{window.fmt.money(r.val)}</div>
                <div className="c3-field-ratio">
                  {r.ratio < 1.01
                    ? <span>0 → 1 step <span className="c3-field-fields">· the unit</span></span>
                    : <span>
                        {Math.round(r.ratio).toLocaleString()} steps
                        {fullFields >= 1 && <span className="c3-field-fields"> · {fullFields} field{fullFields !== 1 ? 's' : ''}</span>}
                      </span>}
                </div>
              </div>
              <div className="c3-field-vis" style={{ width: trackW }}>
                <div style={{ position: 'relative', width: trackW, height: 56 }}>
                  {/* track background — full possible distance */}
                  <div style={{ position: 'absolute', left: 0, right: 0, top: 16, height: 24, background: 'rgba(40,30,20,.05)', borderRadius: 3 }} />

                  {/* the field — turf + mowing stripes + yard lines */}
                  {(() => {
                    const barW = Math.max(24, cw);
                    const mowStep = Math.max(12, barW / 16);   // mowing stripe width
                    const yardStep = Math.max(38, barW / 6);   // yard-line spacing
                    return (
                      <div style={{
                        position: 'absolute', left: 0, top: 16, height: 24, width: barW,
                        background: '#3a8030',
                        backgroundImage:
                          'linear-gradient(180deg, rgba(255,255,255,.18) 0%, transparent 28%, rgba(0,0,0,.16) 100%), ' +
                          `repeating-linear-gradient(90deg, rgba(0,0,0,0) 0 ${mowStep}px, rgba(0,0,0,.09) ${mowStep}px ${mowStep * 2}px), ` +
                          `repeating-linear-gradient(90deg, transparent 0 ${yardStep - 1.5}px, rgba(255,255,255,.55) ${yardStep - 1.5}px ${yardStep}px)`,
                        borderRadius: 2,
                        boxShadow: '0 1px 3px rgba(0,0,0,.22), inset 0 0 0 1px rgba(0,0,0,.10)',
                      }} />
                    );
                  })()}

                  {/* walking figure at start */}
                  <svg style={{ position: 'absolute', left: -3, top: 14, width: 18, height: 28 }} viewBox="0 0 18 28">
                    <circle cx="9" cy="5" r="2.6" fill="#1f1d18" />
                    <line x1="9" y1="7.5" x2="9" y2="15" stroke="#1f1d18" strokeWidth="2" />
                    <line x1="9" y1="11" x2="5" y2="14" stroke="#1f1d18" strokeWidth="1.6" strokeLinecap="round" />
                    <line x1="9" y1="11" x2="13" y2="13" stroke="#1f1d18" strokeWidth="1.6" strokeLinecap="round" />
                    <line x1="9" y1="15" x2="5" y2="24" stroke="#1f1d18" strokeWidth="2" strokeLinecap="round" />
                    <line x1="9" y1="15" x2="13" y2="24" stroke="#1f1d18" strokeWidth="2" strokeLinecap="round" />
                  </svg>

                  {/* flag at end */}
                  <svg style={{ position: 'absolute', left: Math.max(24, cw) - 5, top: 6, width: 20, height: 40 }} viewBox="0 0 20 40">
                    <line x1="3" y1="3" x2="3" y2="38" stroke="#1f1d18" strokeWidth="2" strokeLinecap="round" />
                    <path d="M 3 4 L 17 8 L 3 12 Z" fill="#c96442" stroke="#8b2500" strokeWidth="0.5" strokeLinejoin="round" />
                  </svg>
                </div>
              </div>
            </div>
          );
        })}
      </div>

      <aside className="c3-sidecar">
        <div className="c3-sc-eyebrow">Scale check</div>
        <p className="c3-sc-body">
          One step is <strong>{window.fmt.money(ratios[0].val)}</strong> — the median {metric === 'wealth' ? 'household net worth' : 'household income'}.
          Reaching the Top 1% takes ~<strong>{Math.round(ratios[1].ratio).toLocaleString()} yards</strong> ({(ratios[1].ratio / yardsPerField).toFixed(1)} fields).
          Top 0.1% takes <strong>{(ratios[2].ratio / yardsPerField).toFixed(1)} fields</strong>.
          Top 0.01% takes <strong>{(ratios[3].ratio / yardsPerField).toFixed(1)} fields end-to-end</strong> — about <strong>{(ratios[3].ratio / 1760).toFixed(2)} miles</strong> to reach the same annual {metric === 'wealth' ? 'net worth' : 'income'} you took one step to reach.
        </p>

        <div className="c3-sc-truescale">
          <div className="c3-sc-pixel">
            <svg viewBox="0 0 48 40" style={{ width: 48, height: 40, flexShrink: 0 }}>
              {/* the pixel — literally 2×2, with a hand-drawn red circle marking it like a wrong test answer */}
              <rect x="23" y="19" width="2" height="2" fill="#1f1d18" />
              <path d="M 32 11 C 39 12, 42 19, 39 26 C 36 33, 26 35, 17 32 C 8 29, 7 19, 13 13 C 19 7, 30 8, 34 13"
                fill="none" stroke="#d63840" strokeWidth="2.2"
                strokeLinecap="round" strokeLinejoin="round"
                transform="rotate(-8 24 20)" />
            </svg>
            <p className="c3-sc-quote">At true scale, the median would be a pixel.</p>
          </div>
        </div>
      </aside>
      </div>
    </div>
  );
}

window.ConceptMetaphor = ConceptMetaphor;
</script>

<!-- App: page layout + interactive controls. Renders only after data.json loads. -->
<script type="text/babel" data-presets="react">
// ── Reusable inline controls ────────────────────────────────────────────
function Segmented({ label, value, options, onChange }) {
  return (
    <div className="ctrl">
      <div className="ctrl-label">{label}</div>
      <div className="seg" role="radiogroup" aria-label={label}>
        {options.map((o) => (
          <button key={o.value} role="radio" aria-pressed={value === o.value}
            onClick={() => onChange(o.value)}>{o.label}</button>
        ))}
      </div>
    </div>
  );
}

function Slider({ label, value, min, max, step, format, onChange }) {
  return (
    <div className="ctrl" style={{ flex: 1, minWidth: 220 }}>
      <div className="ctrl-hd">
        <div className="ctrl-label">{label}</div>
        <div className="ctrl-value">{format ? format(value) : value}</div>
      </div>
      <input type="range" className="slider" min={min} max={max} step={step}
        value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </div>
  );
}

function NumberInput({ label, value, onChange, format }) {
  const [text, setText] = React.useState(format ? format(value) : String(value));
  React.useEffect(() => { setText(format ? format(value) : String(value)); }, [value]);
  return (
    <div className="ctrl">
      <div className="ctrl-label">{label}</div>
      <input className="number-in" value={text}
        onChange={(e) => setText(e.target.value)}
        onBlur={() => {
          const n = Number(text.replace(/[$,_\s]/g, ''));
          if (!Number.isNaN(n)) onChange(n); else setText(format ? format(value) : String(value));
        }}
        onKeyDown={(e) => { if (e.key === 'Enter') e.target.blur(); }} />
    </div>
  );
}

// ── Page ────────────────────────────────────────────────────────────────
function Page() {
  const [metric, setMetric] = React.useState('income');
  const [scale, setScale] = React.useState('linear');
  const [yourIncome, setYourIncome] = React.useState(83730);
  const [year, setYear] = React.useState(2024);

  const tweaksDist = { metric, scale, yourIncome };
  const tweaksRate = { scale: 'linear', year };
  const tweaksMeta = { metric };

  return (
    <div className="page">

      <header className="hero">
        <div className="eyebrow">Three ways to see what's happening</div>
        <h1>Capitalism's engine runs on competition. <em>What happens when some players win?</em></h1>
        <p>
          The standard income visualizations — pie charts, quintile bars, bell curves — fail at the one thing they need to do:
          convey scale. The middle of the distribution doesn't look like the middle. The top doesn't fit on the page.
          Growth rates aren't comparable across orders of magnitude.
        </p>
        <p>
          Three concepts below, each tackling the problem differently. The controls are interactive -- move the slider on the 
          first figure and you can <em>feel</em> how hard it is to move up.
        </p>
      </header>

      {/* CONCEPT 1 */}
      <section className="concept-block">
        <ConceptDistribution tweaks={tweaksDist} />
        <div className="controls">
          <Segmented label="Metric" value={metric}
            options={[{value:'income', label:'Income'}, {value:'wealth', label:'Wealth'}]}
            onChange={setMetric} />
          <Segmented label="Axis scale" value={scale}
            options={[{value:'linear', label:'Linear'}, {value:'log', label:'Log'}]}
            onChange={setScale} />
          <Slider label="Your annual income"
            value={yourIncome} min={20000} max={2000000} step={1000}
            format={(v) => '$' + v.toLocaleString()}
            onChange={setYourIncome} />
        </div>
      </section>

      {/* CONCEPT 2 */}
      <section className="concept-block">
        <ConceptRate tweaks={tweaksRate} />
        <div className="controls">
          <Slider label="Year"
            value={year} min={1980} max={2024} step={1}
            format={(v) => String(v)}
            onChange={setYear} />
        </div>
      </section>

      {/* CONCEPT 3 */}
      <section className="concept-block">
        <ConceptMetaphor tweaks={tweaksMeta} />
        <div className="controls">
          <Segmented label="Metric" value={metric}
            options={[{value:'income', label:'Income'}, {value:'wealth', label:'Wealth'}]}
            onChange={setMetric} />
        </div>
      </section>

      <footer className="footer-meta">
        <strong style={{ color: 'var(--ink)' }}>Sources:</strong> Census ASEC 2023, household income P10–P80 inflated to 2024 USD; Piketty-Saez-Zucman Realtime Inequality 2025 release, adult_households unit, for income thresholds P90+ and the 1980–2024 growth series; Federal Reserve SCF 2022 weighted percentiles, inflated to 2024 USD (CPI-U ×1.072), for wealth P10–P99; PSZ Realtime Inequality wealth thresholds for P99.9 and P99.99; EPI State of Working America for 1979–2023 wage growth.
        <span style={{ display: 'block', marginTop: '14px' }}>
          Skeptical of the framing? <a href="/income-viz-audit/" style={{ color: 'var(--accent)' }}>See the same data in plain matplotlib</a>, plus the Python script and source files that produced it.
        </span>
      </footer>
    </div>
  );
}

// Wait for data.json to load, then render.
window.__dataReady.then(() => {
  ReactDOM.createRoot(document.getElementById('root')).render(<Page />);
});
</script>
</body>
</html>
