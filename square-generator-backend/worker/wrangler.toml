name = "square-generator"
main = "src/index.ts"
compatibility_date = "2026-04-01"

# Route to your domain so the page can hit /api/* same-origin.
# Replace squareparty.org with your actual domain.
[[routes]]
pattern = "squareparty.org/api/*"
zone_name = "squareparty.org"

[[d1_databases]]
binding = "DB"
database_name = "squares"
database_id = "352ba023-0604-4bac-bf86-a3d6b84969bf"

[vars]
# Tunable knobs. Override per-environment with --var on deploy if needed.
RATE_LIMIT_WINDOW_SECONDS = "3600"     # 1 hour
RATE_LIMIT_MAX_PER_WINDOW = "1"        # 1 submission per IP per hour
GALLERY_PAGE_SIZE = "60"
ALLOW_ORIGINS = "https://squareparty.org" # comma-separated; CORS allowlist

# Secrets (set with `wrangler secret put`):
#   TURNSTILE_SECRET   — Cloudflare Turnstile secret key
